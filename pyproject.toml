[build-system]
requires = ["setuptools>=68", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "pylogshield" 
description = "A Python logging library designed for data professionals and developers who need reliable, secure logging with minimal setup."
readme = "README.md"

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
requires-python = ">=3.8"
keywords = ["logger", "automation", "package", "custom", "security"]

dynamic = ["version", "dependencies"]
license = 'MIT'
license-files = ['LICENSE']

[project.urls]
homepage = "https://github.com/ihassan8"
documentation = "https://ihassan8.github.io/pylogshield"
repository = 'https://github.com/ihassan8/pylogshield'
issues = "https://github.com/ihassan8/pylogshield/issues/new"

[project.scripts]
pylogshield = "pylogshield.__main__:main"

[project.optional-dependencies]
tui = ["textual>=0.52.0"]
fastapi = ["starlette>=0.27.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools_scm]
# Auto generate _version.py with the corresponding git tag
version_file = "src/pylogshield/_version.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"

